spring:
  application:
    name: finance
  datasource:
    url: jdbc:postgresql://localhost:5432/finup
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'validate' apenas confere se o Java e o Banco estão iguais
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: true
    # garante que ele crie a tabela de histórico se não existi
    baseline-on-migrate: true

  logging:
    level:
      org.flyway: DEBUG
      org.hibernate.SQL: DEBUG

api:
  security:
    key-secret: minhaAchaveAsuperAsecretaAcomAmaisAdeA32AcaracteresA123456
